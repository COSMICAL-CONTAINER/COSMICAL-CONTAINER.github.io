<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #05060f;

  .card h2 { font-size: 18px; font-weight: 500; margin: 10px 0 18px; }
  .card p  { font-size: 13px; opacity: .85; margin-bottom: 24px; word-break: break-all; }
  .card a.btn {
    display: inline-block; margin: 0 6px; color: #fff; text-decoration: none; font-size: 14px;
    border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 22px;
    background: rgba(255,255,255,.08); transition: background .2s;
